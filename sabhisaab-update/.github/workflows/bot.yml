name: Telegram bot deploy

on:
  workflow_dispatch:

jobs:
  bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Packages
        working-directory: worker
        run: npm install --no-audit --no-fund

      - name: Worker deploy karo
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy

      - name: Bot ke secrets set karo
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          put() { printf '%s' "$2" | npx --yes wrangler@4 secret put "$1"; }
          put TG_TOKEN  "${{ secrets.TELEGRAM_TOKEN }}"
          put TG_CHAT   "${{ secrets.TELEGRAM_CHAT_ID }}"
          put GH_TOKEN  "${{ secrets.BOT_GH_TOKEN }}"
          put GH_REPO   "${{ github.repository }}"
          put HOOK_PATH "${{ secrets.BOT_HOOK_PATH }}"
          put SETUP_KEY "${{ secrets.BOT_HOOK_PATH }}"

      - name: Telegram webhook jodo
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          SUB=$(curl -sS "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
                 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                 | python3 -c "import sys,json;print(json.load(sys.stdin)['result']['subdomain'])")
          BASE="https://sabhisaab-bot.$SUB.workers.dev"
          echo "Bot ka pata: $BASE"
          curl -sS "$BASE/setup?key=${{ secrets.BOT_HOOK_PATH }}" | head -c 400
          echo
          echo "Ab Telegram me /help bhejkar dekhein."
