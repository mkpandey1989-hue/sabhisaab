name: Audit aur Deploy

on:
  workflow_dispatch:

concurrency:
  group: sabhisaab-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Repo lao
        uses: actions/checkout@v4

      - name: Python taiyaar karo
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Audit ke liye config banao
        run: |
          cat > config.json <<'EOF'
          {
            "site_url": "https://sabhisaab.com",
            "site_dir": "site",
            "incoming_dir": "/tmp/incoming",
            "gsc_property": "sc-domain:sabhisaab.com",
            "ga4_id": "G-QX5MWV42TR",
            "adsense_approved": false,
            "git_branch": "main",
            "indexnow_key": "x",
            "bing_api_key": "x",
            "bing_enabled": false,
            "google_sa_json": "/tmp/x.json",
            "gsc_enabled": false,
            "gsc_daily_budget": 150,
            "telegram_token": "x",
            "telegram_chat_id": "x",
            "telegram_enabled": false
          }
          EOF

      - name: AUDIT - ek bhi ERROR mila to deploy yahin ruk jaayega
        run: python3 scripts/audit.py

      - name: File ginti check
        run: |
          N=$(ls -1 site | wc -l)
          echo "site/ me files: $N"
          if [ "$N" -lt 300 ]; then echo "BAHUT KAM FILES - ruk rahe hain"; exit 1; fi

      - name: Account ID check karo aur project dhundo
        id: cf
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.request, urllib.error
          TOK = os.environ["CF_TOKEN"].strip()
          ACC = os.environ["CF_ACCT"].strip()

          print("Token  ki lambai : %d  (40 ya 53 hona normal hai)" % len(TOK))
          print("Account ki lambai: %d  (THEEK 32 hona chahiye)" % len(ACC))
          if len(ACC) != 32:
              print("")
              print("XXXX  CLOUDFLARE_ACCOUNT_ID galat hai.  XXXX")
              print("Account ID 32 akshar ka hota hai (sirf a-f aur 0-9).")
              print("Cloudflare dashboard -> Workers & Pages -> dayein 'Account Details'")
              print("box me 'Account ID' ke saamne copy icon dabayein.")
              print("Ya URL me: dash.cloudflare.com/<YAHI-32-AKSHAR>/workers-and-pages")
              sys.exit(1)
          bad = [c for c in ACC.lower() if c not in "0123456789abcdef"]
          if bad:
              print("Account ID me ajeeb akshar hain:", set(bad)); sys.exit(1)

          def api(path):
              req = urllib.request.Request(
                  "https://api.cloudflare.com/client/v4" + path,
                  headers={"Authorization": "Bearer " + TOK})
              try:
                  return json.load(urllib.request.urlopen(req))
              except urllib.error.HTTPError as ex:
                  return json.load(ex)

          pr = api("/accounts/%s/pages/projects" % ACC)
          if not pr.get("success"):
              print("Pages projects nahi mile. Cloudflare ka jawab:")
              print("  errors:", pr.get("errors"))
              print("  -> code 7003 ka matlab: Account ID galat hai")
              print("  -> code 9109/10000 ka matlab: token ki permission kam hai")
              sys.exit(1)

          print("")
          print("Is account me %d Pages project mile:" % len(pr["result"]))
          found = None
          for p in pr["result"]:
              doms = p.get("domains") or []
              print("   PROJECT:", p["name"], "| branch:", p.get("production_branch"), "| domains:", doms)
              if p["name"] == "sabhisaab" or any("sabhisaab.com" in d for d in doms):
                  found = (p["name"], p.get("production_branch") or "main")
          if not found:
              print("sabhisaab project nahi mila - upar ki list me se sahi naam batayein"); sys.exit(1)

          name, br = found
          print("")
          print("MIL GAYA -> project=%s | production_branch=%s" % (name, br))
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("project=%s\nbranch=%s\n" % (name, br))
          PY

      - name: Cloudflare Pages par deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages deploy site \
            --project-name="${{ steps.cf.outputs.project }}" \
            --branch="${{ steps.cf.outputs.branch }}" \
            --commit-dirty=true

      - name: Live site check
        run: |
          sleep 30
          for u in / /percentage-calculator /nsc-calculator /sitemap.xml /contact; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://sabhisaab.com$u")
            echo "$u -> $code"
          done
          echo ""
          echo "--- Naya version live hua ya nahi ---"
          if curl -s https://sabhisaab.com/ | grep -q 'og:image:width" content="1204"'; then
            echo "HAAN - naya v8 live hai"
          else
            echo "NAHI - abhi purana hi hai (shayad preview par gaya)"
          fi
