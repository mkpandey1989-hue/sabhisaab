name: Audit aur Deploy

on:
  workflow_dispatch:

concurrency:
  group: sabhisaab-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Repo lao
        uses: actions/checkout@v4

      - name: Python taiyaar karo
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Audit ke liye config banao
        run: |
          cat > config.json <<'EOF'
          {
            "site_url": "https://sabhisaab.com",
            "site_dir": "site",
            "incoming_dir": "/tmp/incoming",
            "gsc_property": "sc-domain:sabhisaab.com",
            "ga4_id": "G-QX5MWV42TR",
            "adsense_approved": false,
            "git_branch": "main",
            "indexnow_key": "x",
            "bing_api_key": "x",
            "bing_enabled": false,
            "google_sa_json": "/tmp/x.json",
            "gsc_enabled": false,
            "gsc_daily_budget": 150,
            "telegram_token": "x",
            "telegram_chat_id": "x",
            "telegram_enabled": false
          }
          EOF

      - name: AUDIT - ek bhi ERROR mila to deploy yahin ruk jaayega
        run: python3 scripts/audit.py

      - name: File ginti check
        run: |
          N=$(ls -1 site | wc -l)
          echo "site/ me files: $N"
          if [ "$N" -lt 300 ]; then echo "BAHUT KAM FILES - ruk rahe hain"; exit 1; fi

      - name: Account ID aur project khud dhundo (token se)
        id: cf
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          TOK = os.environ["CF_TOKEN"]
          def api(path):
              req = urllib.request.Request(
                  "https://api.cloudflare.com/client/v4" + path,
                  headers={"Authorization": "Bearer " + TOK})
              return json.load(urllib.request.urlopen(req))

          accs = api("/accounts")
          if not accs.get("success"):
              raise SystemExit("Token se account list nahi mili: %s" % accs.get("errors"))
          print("Token ko %d account dikhe" % len(accs["result"]))

          found = None
          for a in accs["result"]:
              aid = a["id"]
              print("  Account:", a.get("name"))
              try:
                  pr = api("/accounts/%s/pages/projects" % aid)
              except Exception as e:
                  print("     projects nahi mile:", e); continue
              if not pr.get("success"):
                  print("     errors:", pr.get("errors")); continue
              for p in pr["result"]:
                  doms = p.get("domains") or []
                  print("     PROJECT:", p["name"], "| branch:", p.get("production_branch"), "| domains:", doms)
                  if p["name"] == "sabhisaab" or any("sabhisaab.com" in d for d in doms):
                      found = (aid, p["name"], p.get("production_branch") or "main")

          if not found:
              raise SystemExit("sabhisaab project kahin nahi mila. Upar ki list dekhein.")

          aid, name, br = found
          print("::add-mask::" + aid)
          print("\nMIL GAYA -> project=%s | production_branch=%s" % (name, br))
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("account=%s\nproject=%s\nbranch=%s\n" % (aid, name, br))
          PY

      - name: Cloudflare Pages par deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cf.outputs.account }}
        run: |
          npx --yes wrangler@4 pages deploy site \
            --project-name="${{ steps.cf.outputs.project }}" \
            --branch="${{ steps.cf.outputs.branch }}" \
            --commit-dirty=true

      - name: Live site check
        run: |
          sleep 30
          for u in / /percentage-calculator /nsc-calculator /sitemap.xml /contact; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://sabhisaab.com$u")
            echo "$u -> $code"
          done
          echo ""
          echo "--- Naya version live hua ya nahi ---"
          if curl -s https://sabhisaab.com/ | grep -q 'og:image:width" content="1204"'; then
            echo "HAAN - naya v8 live hai"
          else
            echo "NAHI - abhi purana hi hai (shayad preview par gaya)"
          fi
