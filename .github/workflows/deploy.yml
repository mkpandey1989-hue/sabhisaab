name: Audit aur Deploy

on:
  workflow_dispatch:

concurrency:
  group: sabhisaab-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Repo lao
        uses: actions/checkout@v4

      - name: Python taiyaar karo
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Audit ke liye config banao
        run: |
          cat > config.json <<'EOF'
          {
            "site_url": "https://sabhisaab.com",
            "site_dir": "site",
            "incoming_dir": "/tmp/incoming",
            "gsc_property": "sc-domain:sabhisaab.com",
            "ga4_id": "G-QX5MWV42TR",
            "adsense_approved": false,
            "git_branch": "main",
            "indexnow_key": "x",
            "bing_api_key": "x",
            "bing_enabled": false,
            "google_sa_json": "/tmp/x.json",
            "gsc_enabled": false,
            "gsc_daily_budget": 150,
            "telegram_token": "x",
            "telegram_chat_id": "x",
            "telegram_enabled": false
          }
          EOF

      - name: AUDIT - ek bhi ERROR mila to deploy yahin ruk jaayega
        run: python3 scripts/audit.py

      - name: File ginti check
        run: |
          N=$(ls -1 site | wc -l)
          echo "site/ me files: $N"
          if [ "$N" -lt 300 ]; then echo "BAHUT KAM FILES - ruk rahe hain"; exit 1; fi

      - name: Cloudflare se production branch pata karo
        id: pb
        continue-on-error: true
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Token length : ${#CF_TOKEN}"
          echo "Account length: ${#CF_ACCT}"
          curl -sS "https://api.cloudflare.com/client/v4/accounts/$CF_ACCT/pages/projects/sabhisaab" \
            -H "Authorization: Bearer $CF_TOKEN" -o resp.json || true
          echo "--- Cloudflare ka jawab ---"
          python3 - <<'PY'
          import json, os
          try:
              d = json.load(open("resp.json"))
          except Exception as e:
              print("JSON padha nahi gaya:", e); d = {}
          print("success :", d.get("success"))
          print("errors  :", d.get("errors"))
          r = d.get("result") or {}
          pb = r.get("production_branch") or "main"
          print("production_branch :", r.get("production_branch"))
          print("Jo istemaal karenge :", pb)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("branch=%s\n" % pb)
          PY

      - name: Branch tay karo
        id: fin
        run: |
          B="${{ steps.pb.outputs.branch }}"
          if [ -z "$B" ]; then B="main"; fi
          echo "Deploy branch = $B"
          echo "branch=$B" >> $GITHUB_OUTPUT

      - name: Cloudflare Pages par deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages deploy site \
            --project-name=sabhisaab \
            --branch="${{ steps.fin.outputs.branch }}" \
            --commit-dirty=true

      - name: Live site check
        run: |
          sleep 25
          for u in / /percentage-calculator /nsc-calculator /sitemap.xml /contact; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://sabhisaab.com$u")
            echo "$u -> $code"
          done
