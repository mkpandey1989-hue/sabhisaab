name: Audit aur Deploy

on:
  workflow_dispatch:

concurrency:
  group: sabhisaab-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Repo lao
        uses: actions/checkout@v4

      - name: Python taiyaar karo
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Audit ke liye config banao
        run: |
          cat > config.json <<'EOF'
          {
            "site_url": "https://sabhisaab.com",
            "site_dir": "site",
            "incoming_dir": "/tmp/incoming",
            "gsc_property": "sc-domain:sabhisaab.com",
            "ga4_id": "G-QX5MWV42TR",
            "adsense_approved": false,
            "git_branch": "main",
            "indexnow_key": "x",
            "bing_api_key": "x",
            "bing_enabled": false,
            "google_sa_json": "/tmp/x.json",
            "gsc_enabled": false,
            "gsc_daily_budget": 150,
            "telegram_token": "x",
            "telegram_chat_id": "x",
            "telegram_enabled": false
          }
          EOF

      - name: AUDIT — ek bhi ERROR mila to deploy yahin ruk jaayega
        run: python3 scripts/audit.py

      - name: File ginti check
        run: |
          N=$(ls -1 site | wc -l)
          echo "site/ me files: $N"
          if [ "$N" -lt 300 ]; then echo "BAHUT KAM FILES - ruk rahe hain"; exit 1; fi

      - name: Cloudflare se production branch pata karo
        id: pb
        run: |
          PB=$(curl -sS \
            "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/pages/projects/sabhisaab" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            | python3 -c "import sys,json;d=json.load(sys.stdin);print(d['result']['production_branch'])")
          echo "Production branch = $PB"
          echo "branch=$PB" >> $GITHUB_OUTPUT

      - name: Cloudflare Pages par deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages deploy site \
            --project-name=sabhisaab \
            --branch="${{ steps.pb.outputs.branch }}" \
            --commit-dirty=true

      - name: Live site check
        run: |
          sleep 20
          for u in / /percentage-calculator /nsc-calculator /sitemap.xml; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://sabhisaab.com$u")
            echo "$u -> $code"
          done
