name: Audit aur Deploy

on:
  workflow_dispatch:
    inputs:
      indexnow:
        description: 'IndexNow par kaunse URL bhejein?'
        required: true
        default: 'badle-hue'
        type: choice
        options:
          - badle-hue
          - sabhi
          - koi-nahi

concurrency:
  group: sabhisaab-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Repo lao
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Python taiyaar karo
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Audit ke liye config banao
        run: |
          cat > config.json <<'EOF'
          {
            "site_url": "https://sabhisaab.com",
            "site_dir": "site",
            "incoming_dir": "/tmp/incoming",
            "gsc_property": "sc-domain:sabhisaab.com",
            "ga4_id": "G-QX5MWV42TR",
            "adsense_approved": false,
            "git_branch": "main",
            "indexnow_key": "x",
            "bing_api_key": "x",
            "bing_enabled": false,
            "google_sa_json": "/tmp/x.json",
            "gsc_enabled": false,
            "gsc_daily_budget": 150,
            "telegram_token": "x",
            "telegram_chat_id": "x",
            "telegram_enabled": false
          }
          EOF

      - name: AUDIT - ek bhi ERROR mila to deploy yahin ruk jaayega
        run: python3 scripts/audit.py

      - name: File ginti check
        run: |
          N=$(ls -1 site | wc -l)
          echo "site/ me files: $N"
          if [ "$N" -lt 300 ]; then echo "BAHUT KAM FILES - ruk rahe hain"; exit 1; fi

      - name: Account ID check karo aur project dhundo
        id: cf
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.request, urllib.error
          TOK = os.environ["CF_TOKEN"].strip()
          ACC = os.environ["CF_ACCT"].strip()
          if len(ACC) != 32:
              print("CLOUDFLARE_ACCOUNT_ID galat hai (32 akshar hona chahiye), abhi:", len(ACC)); sys.exit(1)
          def api(path):
              req = urllib.request.Request("https://api.cloudflare.com/client/v4" + path,
                    headers={"Authorization": "Bearer " + TOK})
              try: return json.load(urllib.request.urlopen(req))
              except urllib.error.HTTPError as ex: return json.load(ex)
          pr = api("/accounts/%s/pages/projects" % ACC)
          if not pr.get("success"):
              print("Cloudflare errors:", pr.get("errors")); sys.exit(1)
          found = None
          for p in pr["result"]:
              doms = p.get("domains") or []
              print("   PROJECT:", p["name"], "| branch:", p.get("production_branch"), "| domains:", doms)
              if p["name"] == "sabhisaab" or any("sabhisaab.com" in d for d in doms):
                  found = (p["name"], p.get("production_branch") or "main")
          if not found:
              print("sabhisaab project nahi mila"); sys.exit(1)
          name, br = found
          print("MIL GAYA -> project=%s | branch=%s" % (name, br))
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("project=%s\nbranch=%s\n" % (name, br))
          PY

      - name: Cloudflare Pages par deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages deploy site \
            --project-name="${{ steps.cf.outputs.project }}" \
            --branch="${{ steps.cf.outputs.branch }}" \
            --commit-dirty=true

      - name: Live site check
        run: |
          sleep 30
          for u in / /percentage-calculator /nsc-calculator /sitemap.xml /contact; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://sabhisaab.com$u")
            echo "$u -> $code"
          done

      - name: IndexNow - Bing, Yandex, Naver, Seznam ko khabar
        if: ${{ github.event.inputs.indexnow != 'koi-nahi' }}
        env:
          MODE: ${{ github.event.inputs.indexnow }}
        run: |
          KEY=""
          for f in site/*.txt; do
            n=$(basename "$f" .txt)
            c=$(tr -d '[:space:]' < "$f")
            if [ "$n" = "$c" ] && [ ${#n} -ge 8 ]; then KEY="$n"; fi
          done
          if [ -z "$KEY" ]; then echo "IndexNow key file nahi mili - chhod rahe hain"; exit 0; fi
          echo "IndexNow key mil gayi (${#KEY} akshar)"

          if [ "$MODE" = "sabhi" ]; then
            echo "Mode: SABHI URL"
            python3 - > urls.txt <<'PY'
          import re
          sm = open("site/sitemap.xml", encoding="utf-8").read()
          for u in re.findall(r"<loc>([^<]+)</loc>", sm):
              print(u)
          PY
          else
            echo "Mode: sirf badle hue URL"
            # PEHLE: git diff HEAD~1 HEAD se URL chunte the.
            # Dikkat: ek deploy se pehle kai ZIP chadhti hain (kai commit), aur beech me
            # "daily state" jaisa commit bhi aa jaata hai. Tab HEAD~1..HEAD me koi HTML
            # hoti hi nahi thi -> 0 URL -> IndexNow skip. Isi wajah se Bing ko kabhi
            # khabar nahi pahunchi.
            # AB: sitemap ke lastmod se chunte hain — kitne bhi commit hon, farak nahi padta.
            python3 - > urls.txt <<'PY'
          import re, datetime
          sm = open("site/sitemap.xml", encoding="utf-8").read()
          cut = (datetime.date.today() - datetime.timedelta(days=3)).isoformat()
          rows = re.findall(r"<loc>([^<]+)</loc>\s*<lastmod>([\d-]+)</lastmod>", sm)
          picked = [u for u, d in rows if d >= cut]
          if not picked:                      # kuch naya nahi mila to sabse naye 20
              rows.sort(key=lambda x: x[1], reverse=True)
              picked = [u for u, _ in rows[:20]]
          for u in picked[:10000]:
              print(u)
          PY
          fi

          N=$(wc -l < urls.txt)
          echo "Bhejne wale URL: $N"
          if [ "$N" -eq 0 ]; then echo "Kuch nahi badla - IndexNow skip"; exit 0; fi
          head -10 urls.txt

          python3 - <<PY
          import json, urllib.request
          key = "$KEY"
          urls = [l.strip() for l in open("urls.txt") if l.strip()][:10000]
          body = json.dumps({
              "host": "sabhisaab.com",
              "key": key,
              "keyLocation": "https://sabhisaab.com/%s.txt" % key,
              "urlList": urls,
          }).encode()
          req = urllib.request.Request("https://api.indexnow.org/IndexNow", data=body,
                headers={"Content-Type": "application/json; charset=utf-8"})
          try:
              r = urllib.request.urlopen(req)
              print("IndexNow: %d URL bheje -> HTTP %d" % (len(urls), r.status))
              if r.status in (200, 202):
                  print("SAFAL — Bing, Yandex, Naver, Seznam ko khabar chali gayi.")
              else:
                  print("CHETAVNI: HTTP", r.status, "— Bing ko shayad khabar na mile.")
          except Exception as e:
              body = ""
              try: body = e.read().decode()[:200]
              except Exception: pass
              print("IndexNow FAIL:", e, body)
              print("Bing ko khabar NAHI gayi. Key file jaanchein: https://sabhisaab.com/<key>.txt")
          PY
