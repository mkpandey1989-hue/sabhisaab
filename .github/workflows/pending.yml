name: Pending kaam

on:
  schedule:
    - cron: '23 3 * * *'      # roz ~9:00 AM IST. Sunday wali doosri line hata di —
                              # dono ka time ek hi tha, isliye Sunday ko do report aati thin.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sabhisaab-pending
  cancel-in-progress: false

jobs:
  pending:
    runs-on: ubuntu-latest
    timeout-minutes: 15        # pehle koi seema nahi thi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Audit (taaza ginti ke liye)
        continue-on-error: true
        run: |
          cat > config.json <<'EOF'
          {"site_url":"https://sabhisaab.com","site_dir":"site","incoming_dir":"/tmp",
           "gsc_property":"sc-domain:sabhisaab.com","ga4_id":"G-QX5MWV42TR",
           "adsense_approved":false,"git_branch":"main","indexnow_key":"x",
           "bing_api_key":"x","bing_enabled":false,"google_sa_json":"/tmp/x.json",
           "gsc_enabled":false,"gsc_daily_budget":150,
           "telegram_token":"x","telegram_chat_id":"x","telegram_enabled":false}
          EOF
          python3 scripts/audit.py || true
      - name: Pending list Telegram par
        timeout-minutes: 10
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 scripts/watch.py pending

      # v10 (21 Oct 2026): kaun se indexing link bheje ja chuke hain, wo yaad rakhna
      # zaroori hai (14 din tak dobara nahi). Isliye state ab yahan bhi save hoti hai.
      - name: Yaad rakho
        if: always()
        run: |
          git config user.name "Sab Hisaab bot"
          git config user.email "contact@sabhisaab.com"
          git add state/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "kuch nahi badla"; exit 0
          fi
          git commit -m "pending state $(date -u +%F)" --quiet
          for i in 1 2 3; do
            if git pull --rebase --autostash --quiet && git push --quiet; then
              echo "push ho gaya (koshish $i)"; exit 0
            fi
            echo "push fail — koshish $i"; sleep $((i * 5))
          done
          echo "::warning::state push nahi ho paaya"

      # Pehle ye fail hone par Telegram par kuch nahi aata tha
      - name: Fail hua to Telegram par batao
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          SRV: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.run_id }}
        run: |
          python3 - <<'EOPY'
          import os, json, urllib.request
          msg = ("\u274C <b>Pending kaam ki list fail ho gayi.</b>\n\n"
                 "Log: %s/%s/actions/runs/%s"
                 % (os.environ["SRV"], os.environ["REPO"], os.environ["RUN"]))
          body = json.dumps({"chat_id": os.environ["TG_CHAT"], "text": msg,
                             "parse_mode": "HTML", "disable_web_page_preview": True}).encode()
          urllib.request.urlopen(urllib.request.Request(
              "https://api.telegram.org/bot%s/sendMessage" % os.environ["TG_TOKEN"],
              data=body, headers={"Content-Type": "application/json"}), timeout=25).read()
          EOPY
