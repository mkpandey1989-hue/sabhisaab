name: GSC report

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gsc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Packages
        run: pip install -q google-auth google-auth-httplib2 google-api-python-client

      - name: Sitemap submit + indexing report
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          GSC_PROPERTY: sc-domain:sabhisaab.com
          GSC_BUDGET: '150'
          GSC_TODO: '12'
        run: python3 scripts/gsc_report.py report

      - name: State yaad rakho
        run: |
          git config user.name "Sab Hisaab bot"
          git config user.email "contact@sabhisaab.com"
          git add state/gsc.json || true
          git diff --cached --quiet || git commit -m "gsc state $(date +%F)"
          git push || true
